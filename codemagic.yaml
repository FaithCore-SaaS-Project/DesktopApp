workflows:
  mac-desktop-release:
    name: Build FC Desktop macOS DMG
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build Next.js & Electron
        script: |
          npm run build
      - name: Build macOS DMG (Universal)
        script: |
          npx electron-builder --mac dmg --universal
    artifacts:
      - release/*.dmg
      - release/*.blockmap
      - release/latest-mac.yml
    publishing:
      email:
        recipients:
          - dulaj@faithcore.org
        notify:
          on_success: true
          on_failure: true