workflows:
  build-mac-desktop-app:
    name: Build FaithCore Mac App (.dmg)
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Dependencies
        script: npm install
      - name: Build Application
        script: npm run build
      - name: Build Electron Mac App
        script: npx electron-builder --mac --publish never
    artifacts:
      - dist/*.dmg
      - release/*.dmg
      - out/**/*.dmg